services:
  - type: web
    name: steward-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_PORT
        value: 3000
      - key: DATABASE_URL
        sync: false   # Neon connection string: postgres://user:pass@host/db?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard after creating the service:
      - key: ALLOWED_ORIGIN
        sync: false   # e.g. https://steward-web.victorokonkwo67.workers.dev
      - key: S3_API_URL
        sync: false   # Cloudflare R2 API URL
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
