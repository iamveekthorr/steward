services:
  - type: web
    name: steward-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_PORT
        value: 3000
      # DATABASE_URL_UNPOOLED: direct Neon connection (no PgBouncer). SQLx uses
      # this because it manages its own pool and needs prepared-statement support.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      # DATABASE_URL: pooled (PgBouncer) — set it too for tooling/introspection,
      # but the Rust app will not use it when UNPOOLED is present.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard after creating the service:
      - key: ALLOWED_ORIGIN
        sync: false   # e.g. https://steward-web.victorokonkwo67.workers.dev
      - key: S3_API_URL
        sync: false   # Cloudflare R2 API URL
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
