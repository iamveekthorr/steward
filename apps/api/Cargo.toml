[package]
name = "steward"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
rand = "0.8"
axum = "0.8.9"
axum-extra = { version = "0.10", features = ["typed-header", "cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
envy = "0.4.2"
jsonwebtoken = "9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "macros", "chrono", "postgres", "derive", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["trace", "cors"] }
sha2 = "0.10"
dashmap = "6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Object storage (Cloudflare R2 via S3-compatible API)
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
async-trait = "0.1"
validator = { version = "0.19", features = ["derive"] }

[dev-dependencies]
sqlx-cli = "0.9.0"
sqlx = { version = "0.9.0", features = ["migrate"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
