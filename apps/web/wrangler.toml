name = "steward-web"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets" }

# ── Local dev ────────────────────────────────────────────────────────────────
# Run the Next.js dev server (not Wrangler) for local development:
#   pnpm dev
#
# ── Build & deploy ──────────────────────────────────────────────────────────
# 1. Set NEXT_PUBLIC_API_URL in Cloudflare Pages dashboard (Settings → Variables)
#    e.g.  NEXT_PUBLIC_API_URL = https://api.yourdomain.com/api/v1
# 2. Build:  pnpm build:cf
# 3. Deploy: pnpm deploy:cf
#
# ── Custom domain ────────────────────────────────────────────────────────────
# Add a custom domain under Workers & Pages → steward-web → Custom Domains.

[vars]
API_URL = "https://steward-api-su6f.onrender.com"

# ── Runtime secrets (set via Cloudflare Pages dashboard, not here) ───────────
# Pages → steward-web → Settings → Environment variables → Production
# Mark RESEND_API_KEY as Encrypted.
#
# Required vars:
#   NEXT_PUBLIC_API_URL   — https://api.yourdomain.com/api/v1   (build-time)
#   NEXT_PUBLIC_APP_URL   — https://steward.pages.dev           (build-time)
#   RESEND_API_KEY        — re_xxxx...                          (runtime secret)
#   RESEND_FROM           — noreply@yourdomain.com              (runtime)
