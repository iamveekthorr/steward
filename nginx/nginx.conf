events {
    worker_connections 1024;
}

http {
    # Rate limit zones — keyed by client IP
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60r/m;

    # Upstream — resolves to the `api` Docker service
    upstream steward_app {
        server api:3000;
    }

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ────────────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Only accept requests from Cloudflare IPs (optional but recommended)
        # See: https://www.cloudflare.com/ips/
        # add_header X-Frame-Options SAMEORIGIN;
        add_header X-Content-Type-Options nosniff;

        # Auth endpoints — strict rate limit (5 req/min per IP)
        location ~ ^/api/v1/auth/(login|register)$ {
            limit_req zone=auth_zone burst=3 nodelay;
            limit_req_status 429;

            proxy_pass         http://steward_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # All other API endpoints — general rate limit (60 req/min per IP)
        location /api/ {
            limit_req zone=api_zone burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://steward_app;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Health check — no rate limit
        location /health {
            proxy_pass http://steward_app;
        }
    }
}
